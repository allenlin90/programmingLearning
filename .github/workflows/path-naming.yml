name: Path naming

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-changed-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate changed path names
        run: python tools/kebab-case-migration.py check --changed-only "origin/${{ github.base_ref }}"
