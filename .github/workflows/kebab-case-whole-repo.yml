name: Whole repository kebab-case migration

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: >-
      (github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.ref == 'agent/kebab-case-whole-repo') &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/kebab-case-whole-repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.ignorecase false

      - name: Build complete migration inventory
        run: |
          python tools/kebab-case-migration.py inventory --format csv > /tmp/kebab-case-paths.csv
          echo "Proposed tracked-path renames: $(($(wc -l < /tmp/kebab-case-paths.csv) - 1))"

      - name: Apply all tracked-path renames
        run: python tools/kebab-case-migration.py apply

      - name: Rewrite path references
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import csv
          import posixpath
          import re
          import subprocess
          from pathlib import Path, PurePosixPath
          from urllib.parse import unquote

          def tracked_paths() -> list[str]:
              raw = subprocess.run(
                  ["git", "ls-files", "-z"], check=True, stdout=subprocess.PIPE
              ).stdout
              return [p.decode("utf-8", "surrogateescape") for p in raw.split(b"\0") if p]

          with open("/tmp/kebab-case-paths.csv", newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))

          file_map = {row["old"]: row["new"] for row in rows}
          inverse = {new: old for old, new in file_map.items()}

          dir_map: dict[str, str] = {}
          for old_file, new_file in file_map.items():
              old_parts = PurePosixPath(old_file).parts
              new_parts = PurePosixPath(new_file).parts
              for length in range(1, min(len(old_parts), len(new_parts))):
                  old_dir = str(PurePosixPath(*old_parts[:length]))
                  new_dir = str(PurePosixPath(*new_parts[:length]))
                  dir_map.setdefault(old_dir, new_dir)

          all_map = {**dir_map, **file_map}
          old_files = set(file_map)
          old_dirs = set(dir_map)

          def map_absolute(old_abs: str):
              old_abs = posixpath.normpath(old_abs).lstrip("./")
              if old_abs in all_map:
                  return all_map[old_abs], "exact"
              extensionless = [p for p in old_files if p.startswith(old_abs + ".")]
              if len(extensionless) == 1:
                  return file_map[extensionless[0]], "extensionless"
              indexes = [p for p in old_files if p.startswith(old_abs.rstrip("/") + "/index.")]
              if len(indexes) == 1:
                  return file_map[indexes[0]], "index"
              parts = PurePosixPath(old_abs).parts
              for length in range(len(parts), 0, -1):
                  prefix = str(PurePosixPath(*parts[:length]))
                  if prefix in old_dirs:
                      suffix = str(PurePosixPath(*parts[length:])) if length < len(parts) else ""
                      mapped = dir_map[prefix]
                      return (f"{mapped}/{suffix}" if suffix else mapped), "prefix"
              return None, None

          def split_suffix(value: str):
              fragment = ""
              query = ""
              base = value
              if "#" in base:
                  base, fragment = base.split("#", 1)
                  fragment = "#" + fragment
              if "?" in base:
                  base, query = base.split("?", 1)
                  query = "?" + query
              return base, query + fragment

          def rewrite_target(target: str, old_source: str, new_source: str) -> str:
              if not target or target.startswith((
                  "#", "http://", "https://", "mailto:", "data:",
                  "javascript:", "${", "{{"
              )):
                  return target
              base, suffix = split_suffix(target)
              if not base:
                  return target
              decoded = unquote(base)
              absolute = decoded.startswith("/")
              explicit_relative = decoded.startswith("./")
              old_abs = (
                  decoded.lstrip("/")
                  if absolute
                  else posixpath.normpath(posixpath.join(posixpath.dirname(old_source), decoded))
              )
              new_abs, kind = map_absolute(old_abs)
              if new_abs is None:
                  return target
              if kind == "extensionless" and not PurePosixPath(decoded).suffix:
                  extension = PurePosixPath(new_abs).suffix
                  if extension:
                      new_abs = new_abs[:-len(extension)]
              elif kind == "index":
                  new_abs = str(PurePosixPath(new_abs).parent)
              if absolute:
                  rewritten = "/" + new_abs
              else:
                  rewritten = posixpath.relpath(
                      new_abs, posixpath.dirname(new_source) or "."
                  )
                  if explicit_relative and not rewritten.startswith("."):
                      rewritten = "./" + rewritten
              return rewritten + suffix

          relative_token = re.compile(
              r"(?<![A-Za-z0-9_])(?P<path>(?:\.\.?/)[A-Za-z0-9_@+%.,~#=\-/]+)"
          )
          root_token = re.compile(
              r"(?P<path>/(?:[A-Za-z0-9_@+%.,~#=\-]+/)+[A-Za-z0-9_@+%.,~#=\-]*)"
          )
          exact_pairs = sorted(
              [(old, new) for old, new in all_map.items() if old != new and "/" in old],
              key=lambda pair: len(pair[0]),
              reverse=True,
          )

          changed = 0
          root = Path.cwd()
          for new_path in tracked_paths():
              path = root / new_path
              if path.is_symlink() or not path.is_file():
                  continue
              try:
                  data = path.read_bytes()
              except OSError:
                  continue
              if b"\0" in data[:8192] or len(data) > 2_000_000:
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              original = text
              old_source = inverse.get(new_path, new_path)
              for old, new in exact_pairs:
                  text = text.replace(old, new)
              def replace(match):
                  return rewrite_target(match.group("path"), old_source, new_path)
              text = relative_token.sub(replace, text)
              text = root_token.sub(replace, text)
              if text != original:
                  path.write_text(text, encoding="utf-8")
                  changed += 1

          unresolved: list[str] = []
          for new_path in tracked_paths():
              path = root / new_path
              if path.is_symlink() or not path.is_file():
                  continue
              try:
                  data = path.read_bytes()
                  if b"\0" in data[:8192] or len(data) > 2_000_000:
                      continue
                  text = data.decode("utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              for old, _ in exact_pairs:
                  if old in text:
                      unresolved.append(f"{new_path}: {old}")
                      if len(unresolved) >= 200:
                          break
              if len(unresolved) >= 200:
                  break

          print(f"Rewrote path references in {changed} text files.")
          if unresolved:
              print("Unresolved legacy path references:")
              print("\n".join(unresolved))
              raise SystemExit(1)
          PY

      - name: Generate migration report
        run: |
          mkdir -p docs/migrations
          cp /tmp/kebab-case-paths.csv docs/migrations/kebab-case-path-map.csv
          renamed=$(($(wc -l < /tmp/kebab-case-paths.csv) - 1))
          cat > docs/migrations/kebab-case-migration-summary.md <<EOF
          # Kebab-case repository migration

          The whole repository was migrated in one automated GitHub Actions run.

          - Proposed and applied tracked-path renames: **${renamed}**
          - Standard tool-discovery names remained exempt.
          - Path references were rewritten before validation.

          See [the complete old-to-new path map](./kebab-case-path-map.csv).
          EOF

      - name: Stage repository migration
        run: git add -A

      - name: Validate path compliance
        run: python tools/kebab-case-migration.py check

      - name: Validate staged changes
        run: git diff --cached --check

      - name: Validate migration report
        run: test -s docs/migrations/kebab-case-path-map.csv

      - name: Remove one-time automation
        run: |
          rm -f .github/workflows/kebab-case-whole-repo.yml
          rm -f .github/kebab-case-trigger.txt

      - name: Commit migration
        run: |
          git add -A
          git diff --cached --stat
          git commit -m "refactor: migrate all repository paths to kebab-case"
          git push origin HEAD:agent/kebab-case-whole-repo
